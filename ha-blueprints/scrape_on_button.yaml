blueprint:
  name: Financial Overview — Scrape on button press
  description: Publish MQTT scrape-all command when a button is pressed.
  domain: automation
  input:
    button_entity:
      name: Button entity
      selector:
        entity:
          domain: input_button
    command_topic:
      name: MQTT command topic
      default: bank_scraper/command
    mqtt_secret:
      name: Command secret
      description: Same value as Financial Overview MQTT command secret (use !secret in automations).
  source_url: https://github.com/yohaybn/Israeli-Financial-Overview/blob/main/ha-blueprints/scrape_on_button.yaml

trigger:
  - platform: state
    entity_id: !input button_entity

action:
  - service: mqtt.publish
    data:
      topic: !input command_topic
      payload: >-
        {"command":"scrape","args":{"all":true},"secret":"{{ mqtt_secret }}","requestId":"ha-button-{{ now().timestamp }}"}

mode: single

variables:
  mqtt_secret: !input mqtt_secret
