blueprint:
  name: Financial Overview — Review reminder
  description: Notify when transactions need category or memo review.
  domain: automation
  input:
    state_topic:
      name: Review state topic
      default: bank_scraper/state/review
    notify_service:
      name: Notification service
      selector:
        text:
  source_url: https://github.com/yohaybn/Israeli-Financial-Overview/blob/main/ha-blueprints/review_reminder.yaml

trigger:
  - platform: mqtt
    topic: !input state_topic

condition:
  - condition: template
    value_template: "{{ trigger.payload_json.count | int > 0 }}"

action:
  - service: "{{ notify_service }}"
    data:
      title: "Transactions to review"
      message: "{{ trigger.payload_json.count }} transactions need a category or memo"

mode: single

variables:
  notify_service: !input notify_service
