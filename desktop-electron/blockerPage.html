<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financial Overview - Locked</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary-color: #059669;
            --primary-hover: #047857;
            --error-color: #ef4444;
            --border-color: #334155;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            overflow: hidden;
        }

        .container {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 48px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        .icon {
            width: 64px;
            height: 64px;
            margin-bottom: 24px;
            color: var(--primary-color);
        }

        h1 {
            margin: 0 0 8px 0;
            font-size: 24px;
            font-weight: 600;
        }

        p {
            margin: 0 0 32px 0;
            color: var(--text-muted);
            font-size: 15px;
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(5, 150, 105, 0.25);
        }

        button {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: none;
            background-color: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 12px;
            min-height: 20px;
            font-weight: 500;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Lock Icon -->
        <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
        </svg>

        <h1>App Locked</h1>
        <p>Enter your password to access Financial Overview.</p>

        <form id="unlock-form">
            <input type="password" id="password" placeholder="Password" autofocus required autocomplete="current-password">
            <button type="submit" id="submit-btn">Unlock</button>
            <div id="error-msg" class="error"></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('unlock-form');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('error-msg');

        let isSubmitting = false;
        let lockoutTimer = null;

        // Listen for responses from the main process
        window.blocker.onResult((result) => {
            isSubmitting = false;
            
            if (result.success) {
                submitBtn.innerHTML = 'Unlocked!';
                submitBtn.style.backgroundColor = '#10b981';
                // The window will be destroyed by the main process
            } else {
                passwordInput.disabled = false;
                passwordInput.value = '';
                passwordInput.focus();
                
                if (result.error === 'locked_out') {
                    startLockout(result.retryAfterMs);
                } else {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = 'Unlock';
                    errorMsg.textContent = result.message || 'Incorrect password';
                }
            }
        });

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (isSubmitting || submitBtn.disabled) return;

            const password = passwordInput.value.trim();
            if (!password) return;

            isSubmitting = true;
            passwordInput.disabled = true;
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loading-spinner"></div>';
            errorMsg.textContent = '';

            window.blocker.attemptUnlock(password);
        });

        function startLockout(ms) {
            submitBtn.disabled = true;
            passwordInput.disabled = true;
            
            let remaining = Math.ceil(ms / 1000);
            
            const updateUI = () => {
                if (remaining <= 0) {
                    clearInterval(lockoutTimer);
                    submitBtn.disabled = false;
                    passwordInput.disabled = false;
                    submitBtn.innerHTML = 'Unlock';
                    errorMsg.textContent = '';
                    passwordInput.focus();
                } else {
                    const mins = Math.floor(remaining / 60);
                    const secs = remaining % 60;
                    const timeStr = mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
                    submitBtn.innerHTML = 'Locked';
                    errorMsg.textContent = `Too many attempts. Try again in ${timeStr}.`;
                    remaining--;
                }
            };
            
            updateUI();
            lockoutTimer = setInterval(updateUI, 1000);
        }
    </script>
</body>
</html>
